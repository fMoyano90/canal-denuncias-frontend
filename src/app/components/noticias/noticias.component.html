<div class="container animated fadeIn">
  <div class="row mt-3">
    <div class="col-8">
      <!-- Alerta de nueva sección -->
      <div class="alert alert-info" style="background-color: #d1ecf1; border-color: #bee5eb; color: #0c5460;">
        <strong>¡Nueva sección!</strong> Pronto podrá conocer las noticias más actualizadas de la compañía.
      </div>
    </div>
    <div class="col-4 text-center">
      <div class="card">
        <div class="card-body">
          <h2><i class="fas fa-calendar-day"></i></h2>
          <h3 class="pb-0 mb-0">
            <b>{{ hoy().dayStr }} {{ hoy().day }}</b>
          </h3>
          <h3 class="pt-0 mt-0">de {{ hoy().month }}</h3>
          <h1>{{ hoy().year }}</h1>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-12 text-center">
      <nav>
        <ul class="pagination justify-content-center">
          <li class="page-item disabled">
            <span class="page-link">« Anterior</span>
          </li>
          <li class="page-item disabled">
            <span class="page-link">Siguiente »</span>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
