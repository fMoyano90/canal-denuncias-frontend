<div class="image-gallery">
  <div class="thumbnails">
    <img 
      *ngFor="let image of images; let i = index"
      [src]="image.small"
      [alt]="image.description || 'Imagen ' + (i + 1)"
      class="thumbnail"
      (click)="openImage(image, i)"
    />
  </div>

  <!-- Modal para imagen ampliada -->
  <div class="modal" *ngIf="selectedImage" (click)="closeImage()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <span class="close" (click)="closeImage()">&times;</span>
      <img [src]="selectedImage.big" [alt]="selectedImage.description" />
      
      <div class="navigation">
        <button 
          class="nav-btn prev" 
          (click)="prevImage()" 
          [disabled]="currentIndex === 0"
        >
          &#8249;
        </button>
        <button 
          class="nav-btn next" 
          (click)="nextImage()" 
          [disabled]="currentIndex === images.length - 1"
        >
          &#8250;
        </button>
      </div>
      
      <div class="description" *ngIf="selectedImage.description">
        {{ selectedImage.description }}
      </div>
    </div>
  </div>
</div>
